http_port 3128

# Memory-only cache: the UFS disk store crashed under this workload, and the
# artifact store is the durable/pinned path. A robust disk cache is future work.
cache_mem 128 MB
cache_dir null /tmp

acl localnet src 10.66.1.0/24
acl localnet src 10.67.0.0/24
acl localnet src 172.16.0.0/12
acl localnet src 127.0.0.1/32

acl SSL_ports port 443
acl Safe_ports port 80 443

# Only package/artifact origins; everything else is denied.
acl allowed_domains dstdomain .ubuntu.com .debian.org .pypi.org .pythonhosted.org .github.com .githubusercontent.com

http_access allow localnet allowed_domains
http_access allow CONNECT localnet SSL_ports
http_access deny all
