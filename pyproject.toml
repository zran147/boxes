[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxes"
version = "0.0.1"
description = "Procedural generator for HTB-style vulnerable machines"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "cryptography>=41"]

[project.scripts]
boxes = "boxes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration tests that require a Docker daemon (opt in with BOXES_DOCKER_TESTS=1)",
]
