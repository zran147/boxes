id: htpasswd-creds
version: 1.0.0
kind: creds
description: "Crack the Nostromo .htpasswd file for david's password."
os: ["ubuntu-*", "debian-*"]
difficulty: 3
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - access_shell($u)
provides:
  - creds.uname(david)
  - creds.pass($p)
params:

  p:
    type: password
    length: 12
walkthrough: |
  The world-readable `.htpasswd` contains david's password hash. Cracking
          it reveals `{p}`, which is reused for SSH.
