id: vm-sudo-misconfig
version: 1.0.0
kind: privesc
description: A sudoers misconfiguration on a real VM.
os: ["ubuntu-*"]
difficulty: 0.3
fidelity: vm
provision: ./provision.sh
poc:
  script: ./poc.sh
  context: target
actor: $u
yields: ["root"]
requires:
  - access_shell($u)
provides:
  - access_root()
params:
  binary:
    type: choice
    values: ["/usr/bin/find", "/usr/bin/python3"]
walkthrough: |
  `sudo -l` reveals that `{u}` may run `{binary}` as root without a password.
  We use its escape sequence to spawn a root shell and read `root.txt`.
