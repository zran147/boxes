id: vm-env-leak-creds
version: 1.0.0
kind: creds
description: "An exposed .env on the VM leaks SSH credentials."
os: ["ubuntu-*"]
difficulty: 0.2
provision: ./provision.sh
poc:
  context: attacker
  vm: ./poc.sh
requires:
  - open_port($h, 80)
provides:
  - creds($leak_user, $leak_pass)
params:
  leak_user:
    type: choice
    values: ["ubuntu", "webmaster"]
  leak_pass:
    type: password
    length: 13
walkthrough: |
  Requesting `/.env` on the VM returns an unredacted file containing SSH
  credentials: `{leak_user}` / `{leak_pass}`.
