id: viewuser-suid-discovery
version: 1.0.0
kind: discovery
description: "Enumerate the custom SUID viewuser helper."
os: ["ubuntu-*", "debian-*"]
difficulty: 2
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
provides:
  - knows(suid, viewuser)
walkthrough: |
  Local enumeration finds `/usr/local/bin/viewuser`, a root-owned helper
   that invokes a user-controlled path. We still need to abuse it.
