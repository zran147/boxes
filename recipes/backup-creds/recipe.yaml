id: backup-creds
version: 1.0.0
kind: creds
description: "A backup service leaks SSH credentials."
os: ["ubuntu-*", "debian-*"]
difficulty: 2
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 8080)
provides:
  - creds($backup_user, $backup_pass)
  - creds.uname($backup_user)
  - creds.pass($backup_pass)
params:
  backup_user:
    type: username
    styles: ["svc_role", "role"]
  backup_pass:
    type: password
    length: 13
walkthrough: |
  A backup service on port 8080 serves `credentials.txt`, which leaks SSH
  credentials: `{backup_user}` / `{backup_pass}`.
