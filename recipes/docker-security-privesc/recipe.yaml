id: docker-security-privesc
version: 1.0.0
kind: privesc
description: "Abuse the custom SUID docker-security helper for root."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
provides:
  - access_root()
walkthrough: |
  The custom `/usr/local/bin/docker-security` helper sets UID 0 before
          invoking a command. We use it to read `/root/root.txt`.
