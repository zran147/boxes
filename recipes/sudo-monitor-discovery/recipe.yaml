id: sudo-monitor-discovery
version: 1.0.0
kind: discovery
description: "Enumerate a sudo rule for a user-writable monitoring script."
os: ["ubuntu-*", "debian-*"]
difficulty: 2
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
provides:
  - knows(sudo, monitor)
walkthrough: |
  `sudo -l` shows that `{u}` may run `/home/{u}/monitor.sh` as root. The
          script lives in the user's home, so it may be editable.
