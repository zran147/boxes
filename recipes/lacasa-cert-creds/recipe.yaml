id: lacasa-cert-creds
version: 1.0.0
kind: creds
description: "Read the professor's SSH credential from the exposed home directory."
os: ["ubuntu-*", "debian-*"]
difficulty: 3
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - access_shell($u)
provides:
  - creds.uname(professor)
  - creds.pass($p)
params:

  p:
    type: password
    length: 14
walkthrough: |
  From the root shell we can read the exposed home directory backup and
          recover professor's SSH password `{p}`.
