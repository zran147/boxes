id: magento-admin-creds
version: 1.0.0
kind: creds
description: "Use the Magento authentication bypass to create an administrator."
os: ["ubuntu-*", "debian-*"]
difficulty: 4
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 80)
  - knows(path, $path)
provides:
  - creds.uname($u)
  - creds.pass($p)
params:

  u:
    type: username
  p:
    type: password
    length: 10
walkthrough: |
  The Magento authentication bypass creates the admin account `{u}` /
          `{p}` in the store.
