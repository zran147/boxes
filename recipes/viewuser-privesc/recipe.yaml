id: viewuser-privesc
version: 1.0.0
kind: privesc
description: "Abuse a custom SUID viewuser helper to run commands as root."
os: ["ubuntu-*", "debian-*"]
difficulty: 4
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
  - knows(suid, viewuser)
provides:
  - access_root()
walkthrough: |
  `/usr/local/bin/viewuser` runs with root privileges and invokes a
          user-controlled helper. We use it to read `/root/root.txt`.
