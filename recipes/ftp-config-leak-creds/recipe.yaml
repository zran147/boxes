id: ftp-config-leak-creds
version: 1.0.0
kind: creds
description: Enumerate the accessible FTP share and find leaked SSH credentials.
os: ["ubuntu-*", "debian-*"]
difficulty: 0.2
fidelity: container
provision: ./provision.sh
poc:
  script: ./poc.sh
  context: attacker
requires:
  - service_access(ftp, $u, $p)
provides:
  - creds($ssh_user, $ssh_pass)
  - creds.uname($ssh_user)
  - creds.pass($ssh_pass)
params:
  ssh_user:
    type: choice
    values: ["deploy", "backup", "svc_web"]
  ssh_pass:
    type: password
    length: 14
walkthrough: |
  Listing the FTP share reveals a `backup/.env` file with a hard-coded
  credential. Reading it gives us SSH credentials: `{ssh_user}` / `{ssh_pass}`.
