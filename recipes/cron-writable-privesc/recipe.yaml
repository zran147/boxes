id: cron-writable-privesc
version: 1.0.0
kind: privesc
description: "Write into a root-executed cron script."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - access_shell($u)
  - knows(cron, writable)
provides:
  - access_root()
walkthrough: |
  The root scheduler executes our writable script every second. We make
          it copy `/root/root.txt` somewhere the foothold user can read.
