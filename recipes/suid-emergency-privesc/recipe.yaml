id: suid-emergency-privesc
version: 1.0.0
kind: privesc
description: "Abuse the custom SUID emergency helper to read root.txt."
os: ["ubuntu-*", "debian-*"]
difficulty: 4
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
  - knows(suid, emergency)
provides:
  - access_root()
walkthrough: |
  The SUID `emergency` helper keeps effective root privileges. Running it
          with a command lets us read `/root/root.txt`.
