id: sudo-script-privesc
version: 1.0.0
kind: privesc
description: "Edit a user-writable script that sudo runs as root."
os: ["ubuntu-*", "debian-*"]
difficulty: 4
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - access_shell($u)
  - knows(sudo, monitor)
provides:
  - access_root()
walkthrough: |
  The monitoring script is owned by `{u}` but sudoers permits running it
          as root. We replace its body with a command that reads `root.txt`.
