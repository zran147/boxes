id: ssh-creds-foothold
version: 1.0.0
kind: foothold
description: Reuse discovered credentials to obtain an interactive SSH shell.
os: ["ubuntu-*", "debian-*"]
difficulty: 2
tools: [sshpass, ssh]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
yields: ["user"]
requires:
  - open_port($h, 22)
  - creds.uname($u)
  - creds.pass($p)
provides:
  - access_shell($u)
  - user_shell($u)
walkthrough: |
  We reuse the credentials we already have (`{u}` / `{p}`) against SSH on port
  22. They are valid and return an interactive shell as `{u}` — whose home
  directory holds `user.txt`, so the user flag is read here.
