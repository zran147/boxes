id: web-env-leak-creds
version: 1.0.0
kind: creds
description: An exposed .env file on the web server leaks service credentials.
os: ["ubuntu-*", "debian-*"]
difficulty: 2
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 80)
provides:
  - creds($leak_user, $leak_pass)
  - creds.uname($leak_user)
  - creds.pass($leak_pass)
params:
  leak_user:
    type: username
  leak_pass:
    type: password
    length: 13
walkthrough: |
  Requesting `/.env` on the web server returns an unredacted file containing
  database and SSH credentials: `{leak_user}` / `{leak_pass}`.
