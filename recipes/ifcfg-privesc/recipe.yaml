id: ifcfg-privesc
version: 1.0.0
kind: privesc
description: "Inject a command into the sudo-run network interface helper."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
provides:
  - access_root()
walkthrough: |
  `sudo /usr/local/sbin/changename.sh` reads an interface name and passes
          the trailing command to a root shell. We use it to read `root.txt`.
