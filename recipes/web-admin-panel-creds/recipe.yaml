id: web-admin-panel-creds
version: 1.0.0
kind: creds
description: A discovered admin endpoint leaks credentials for another service.
os: ["ubuntu-*", "debian-*"]
difficulty: 0.3
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 80)
  - knows(path, $path)
provides:
  - creds($admin_user, $admin_pass)
  - creds.uname($admin_user)
  - creds.pass($admin_pass)
params:
  admin_user:
    type: choice
    values: ["admin", "webadmin"]
  admin_pass:
    type: password
    length: 12
walkthrough: |
  The endpoint `/{path}/config.php` we discovered leaks credentials for
  `{admin_user}` / `{admin_pass}`, which are reused elsewhere on the box.
