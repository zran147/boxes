id: irc-backdoor-foothold
version: 1.0.0
kind: foothold
description: "Exploit the UnrealIRCd 3.2.8.1 backdoor for a shell as ircd."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
assets: ./files
requires:
  - open_port($h, 8067)
  - knows(service, unrealircd)
provides:
  - access_shell(ircd)
walkthrough: |
  The IRC daemon exposes the `AB;` backdoor. Sending a command through the
          IRC listener executes it as the `ircd` service account.
