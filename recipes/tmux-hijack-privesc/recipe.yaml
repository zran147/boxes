id: tmux-hijack-privesc
version: 1.0.0
kind: privesc
description: "Hijack a root terminal session through an accessible tmux socket."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
yields: ["root"]
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - access_shell($u)
  - knows(tmux, root)
provides:
  - access_root()
walkthrough: |
  We attach to the root session socket and run a command in that root
          context, reading `/root/root.txt`.
