id: heartbleed-discovery
version: 1.0.0
kind: discovery
description: "Recognise a Heartbleed-era TLS service and its memory-leak surface."
os: ["ubuntu-*", "debian-*"]
difficulty: 2
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 8442)
provides:
  - knows(vuln, heartbleed)
walkthrough: |
  The service on 8442 advertises a vulnerable OpenSSL build. A Heartbleed
          probe can leak process memory, including key material.
