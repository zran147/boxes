id: opennetadmin-rce-foothold
version: 1.0.0
kind: foothold
description: "Exploit the OpenNetAdmin command-injection bug for a www-data shell."
os: ["ubuntu-*", "debian-*"]
difficulty: 5
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
assets: ./files
requires:
  - open_port($h, 8090)
  - knows(path, $path)
provides:
  - access_shell(www-data)
walkthrough: |
  The `{path}` OpenNetAdmin instance passes `xajaxargs` to a shell. We use
          it to execute commands as `www-data` without claiming the flag yet.
