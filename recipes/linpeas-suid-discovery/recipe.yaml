id: linpeas-suid-discovery
version: 1.0.0
kind: discovery
description: Post-exploitation enumeration finds an unusual SUID binary.
os: ["ubuntu-*", "debian-*"]
difficulty: 3
provision: ./provision.sh
poc:
  context: target
  container: ./poc.sh
actor: $u
requires:
  - user_shell($u)
provides:
  - knows(suid, $binary)
params:
  binary:
    type: choice
    values: ["find"]
walkthrough: |
  With a shell as `{u}` we run local enumeration and notice an unusual SUID
  binary: `{binary}`. This is knowledge only — we still have to abuse it.
