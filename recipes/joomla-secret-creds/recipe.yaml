id: joomla-secret-creds
version: 1.0.0
kind: creds
description: "Read the secret file left in the Joomla web root."
os: ["ubuntu-*", "debian-*"]
difficulty: 2
tools: [curl]
provision: ./provision.sh
poc:
  context: attacker
  container: ./poc.sh
requires:
  - open_port($h, 80)
  - knows(path, $path)
provides:
  - creds.uname($u)
  - creds.pass($p)
params:

  u:
    type: username
  p:
    type: password
    length: 14
walkthrough: |
  The commented `secret.txt` in the web root contains the Joomla admin
          credential `{u}` / `{p}`.
